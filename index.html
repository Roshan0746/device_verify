<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hardware Security Pass</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@v4/dist/fp.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(18, 24, 38, 0.75);
            --border-color: rgba(56, 189, 248, 0.25);
            --primary-accent: #00f2fe;
            --secondary-accent: #4facfe;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success-color: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, var(--bg-color) 70%);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
            overflow: hidden;
        }

        .container {
            max-width: 380px;
            width: 100%;
            text-align: center;
            position: relative;
        }

        /* Shield Radar Animation */
        .shield-wrapper {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 1.5rem auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .radar-ring {
            position: absolute;
            border-radius: 50%;
            border: 1.5px solid rgba(0, 242, 254, 0.2);
            animation: pulseRing 3s linear infinite;
        }

        .radar-ring:nth-child(1) { width: 100%; height: 100%; animation-delay: 0s; }
        .radar-ring:nth-child(2) { width: 75%; height: 75%; animation-delay: 1s; }
        .radar-ring:nth-child(3) { width: 50%; height: 50%; animation-delay: 2s; }

        @keyframes pulseRing {
            0% { transform: scale(0.8); opacity: 0; border-color: var(--primary-accent); }
            50% { opacity: 0.6; }
            100% { transform: scale(1.3); opacity: 0; border-color: var(--secondary-accent); }
        }

        .shield-icon {
            width: 65px;
            height: 65px;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 2px solid var(--primary-accent);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.35);
            z-index: 2;
            transition: all 0.5s ease;
        }

        .shield-icon svg {
            width: 34px;
            height: 34px;
            fill: none;
            stroke: var(--primary-accent);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Typography */
        h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 0.35rem;
            background: linear-gradient(90deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        /* Glassmorphism Card */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 1.5rem;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        /* Live Scanning Progress Box */
        .status-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 1.25rem;
            font-family: monospace;
            font-size: 12px;
            color: var(--primary-accent);
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: left;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: var(--primary-accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--primary-accent);
            animation: blink 1s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Verify Button */
        .action-btn {
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, var(--secondary-accent) 0%, var(--primary-accent) 100%);
            color: #030712;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.6px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0, 242, 254, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        /* Security Badges Grid */
        .badges {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 1.25rem;
            padding-top: 1.25rem;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .badge-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 8px 4px;
        }

        .badge-item span {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: #cbd5e1;
        }

        .footer-note {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 1.25rem;
            letter-spacing: 0.2px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Shield Scanner -->
        <div class="shield-wrapper">
            <div class="radar-ring"></div>
            <div class="radar-ring"></div>
            <div class="radar-ring"></div>
            <div class="shield-icon" id="shieldIcon">
                <svg viewBox="0 0 24 24">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    <path d="M9 12l2 2 4-4"></path>
                </svg>
            </div>
        </div>

        <!-- Headings -->
        <h1>Anti-Cheat Gate</h1>
        <p class="subtitle">Hardware Fingerprint Verification</p>

        <!-- Main Card -->
        <div class="card">
            <div class="status-box">
                <div class="dot" id="liveDot"></div>
                <span id="statusText">System Ready. Click to bind device.</span>
            </div>

            <button class="action-btn" id="verifyBtn" onclick="initiateDeviceAuth()">
                AUTHORIZE HARDWARE
            </button>

            <!-- Verification Feature Badges -->
            <div class="badges">
                <div class="badge-item">
                    <span>🛡️ Nonce Hash</span>
                </div>
                <div class="badge-item">
                    <span>🔒 Anti-Cloning</span>
                </div>
                <div class="badge-item">
                    <span>⚡ Instant Pass</span>
                </div>
            </div>
        </div>

        <p class="footer-note">
            Strict Policy: 1 Device = 1 Account • Cheating attempts are permanently logged.
        </p>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // Configure your target bot username here
        const TARGET_BOT_USERNAME = "YourActualBotUsername"; // Apne bot ka username bina @ ke daalo

        async function initiateDeviceAuth() {
            const btn = document.getElementById('verifyBtn');
            const status = document.getElementById('statusText');
            const icon = document.getElementById('shieldIcon');
            const dot = document.getElementById('liveDot');

            btn.disabled = true;
            btn.style.opacity = '0.7';
            btn.textContent = 'SCANNING...';

            status.textContent = 'Analyzing Hardware & Canvas...';

            try {
                // Initialize FingerprintJS
                const fp = await FingerprintJS.load();
                const result = await fp.get();
                const visitorId = result.visitorId;

                status.textContent = 'Generating Cryptographic Nonce...';

                setTimeout(() => {
                    status.textContent = '✓ Hardware Verified Successfully';
                    status.style.color = '#10b981';
                    dot.style.background = '#10b981';
                    dot.style.boxShadow = '0 0 10px #10b981';

                    btn.textContent = '✓ AUTHORIZED';
                    btn.style.background = 'linear-gradient(135deg, #10b981 0%, #059669 100%)';
                    btn.style.boxShadow = '0 8px 25px rgba(16, 185, 129, 0.4)';
                    btn.style.color = '#ffffff';

                    icon.style.borderColor = '#10b981';
                    icon.style.boxShadow = '0 0 30px rgba(16, 185, 129, 0.5)';

                    setTimeout(() => {
                        if (tg) {
                            tg.openTelegramLink(`https://t.me/${TARGET_BOT_USERNAME}?start=v_${visitorId}`);
                            setTimeout(() => { tg.close(); }, 400);
                        } else {
                            alert("Please open this verification screen directly inside the Telegram Bot.");
                            btn.disabled = false;
                            btn.style.opacity = '1';
                            btn.textContent = 'AUTHORIZE HARDWARE';
                        }
                    }, 700);
                }, 900);

            } catch (err) {
                status.textContent = '❌ Verification Error: ' + err.message;
                status.style.color = '#ef4444';
                btn.disabled = false;
                btn.style.opacity = '1';
                btn.textContent = 'RETRY SCAN';
            }
        }
    </script>
</body>
</html>
